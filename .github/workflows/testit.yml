name: Testit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Asenna
        run: python -m pip install --quiet --disable-pip-version-check -e ".[dev]"
      - name: Tyypit
        run: python -m mypy --strict portti
      - name: Yksikkötestit
        run: python -m pytest -q
      - name: Omat regressiotapaukset
        run: portti tarkista-tapaukset .portti/tapaukset.yml
